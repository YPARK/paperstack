[package]
name = "paperstack"
version = "0.1.1"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Yongjin Park <yongjin.park@ubc.ca>"]
description = "A library of papers in the terminal: PDFs and their references, kept in a folder an agent can read"
repository = "https://github.com/YPARK/paperstack"
keywords = ["bibtex", "pdf", "references", "tui"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.6", features = ["derive", "env"] }
deunicode = "1.6"
pdf-extract = "0.12"
ratatui = "0.30"
regex = "1.13.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
unicode-normalization = "0.1"
# HTTPS in pure Rust: rustls, with RustCrypto's algorithms rather than ring's C.
ureq = { version = "3.4", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "gzip"] }
rustls-rustcrypto = "=0.0.2-alpha"

[dev-dependencies]
tempfile = "3.27"
